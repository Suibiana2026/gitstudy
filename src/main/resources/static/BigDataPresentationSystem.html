        .header-button {
            margin-left: 10px;

        /* 新增或修改按钮样式 */
        #homeButton,
        #generateSalesPlan {
            margin-left: 10px;
            padding: 8px 16px; /* 调整内边距，让按钮内容更舒适 */

            <div class="left-bottom rightTop border">

<script>
    function getParameterByName(name, url = window.location.href) {
        name = name.replace(/[\[\]]/g, '\\$&');
        var regex = new RegExp('[?&]' + name + '(=([^&#]*)|&|#|$)'),
            results = regex.exec(url);
        if (!results) return null;
        if (!results[2]) return '';
        return decodeURIComponent(results[2].replace(/\+/g, ' '));
    }
    var uroot = getParameterByName('uroot');

    // // 非法登录校验
    // if (uroot == null) {
    //     alert("非法登录");
    //     window.location.href = "login.html"
    // }
    $(document).ready(function () {
        $('#logoutButton').click(function() {
            // 这里替换为你实际的退出登录逻辑
            window.location.href = 'login.html'; // 跳转到登录页
        });
        // 首页按钮功能
        $('#homeButton').click(function () {
            function getParameterByName(name, url = window.location.href) {
                name = name.replace(/[\[\]]/g, '\\$&');
                var regex = new RegExp('[?&]' + name + '(=([^&#]*)|&|#|$)');
                var results = regex.exec(url);
                if (!results) return null;
                if (!results[2]) return '';
                return decodeURIComponent(results[2].replace(/\+/g, ' '));
            }
            var uroot = getParameterByName('uroot');
            var homeUrl = 'IndexSystem.html?uroot=0';
            // if (uroot) {
            //     homeUrl += '?uroot=' + encodeURIComponent(uroot);
            // }
            window.location.href = homeUrl;
        });

        function getParameterByName(name, url = window.location.href) {
            name = name.replace(/[\[\]]/g, '\\$&');
            var regex = new RegExp('[?&]' + name + '(=([^&#]*)|&|#|$)');
            var results = regex.exec(url);
            if (!results) return null;
            if (!results[2]) return '';
            return decodeURIComponent(results[2].replace(/\+/g, ' '));
        }
        var uroot = getParameterByName('uroot');

        if (uroot == 2) {
            document.getElementById("userControlLink") && (document.getElementById("userControlLink").style.display = 'none');
        }

        const headerImgElement = document.getElementById('header-img-element');
        if (headerImgElement) {
            setTimeout(() => {
                headerImgElement.style.backgroundImage = "url('../../images/BigDataPresentation/1.png')";
            }, 1000);
        }

        // 一键生成销售方案功能
        $('#generateSalesPlan').click(async function () {
            if (typeof docxtemplater === 'undefined' || typeof PizZip === 'undefined' || typeof saveAs === 'undefined' || typeof marked === 'undefined') {
                alert('生成 Word 文档所需的依赖库未加载，请检查网络或刷新页面');
                return;
            }

            try {
                // 从页面中收集数据
                const salesPlanData = collectSalesDataFromPage();
                generateSalesStrategy(salesPlanData);
                alert('销售方案 Word 文档生成成功！');
            } catch (error) {
                console.error('生成 Word 文档失败:', error);
                alert(`生成 Word 文档失败：${error.message || '未知错误，请稍后重试'}`);
            }
        });

        // 从页面中收集销售数据
        function collectSalesDataFromPage() {
            try {
                // 1. 基本信息（从 .top-list 中提取）
                const topListDiv = document.querySelector('.top-list');
                const basicInfo = {
                    onlineUsers: parseInt(topListDiv.children[0].children[0].nextSibling.textContent.trim()) || 0,
                    onlineMerchants: parseInt(topListDiv.children[1].children[0].nextSibling.textContent.trim()) || 0,
                    transactionAmount: parseFloat(topListDiv.children[2].children[0].nextSibling.textContent.trim().replace('¥', '')) || 0,
                    transactionCount: parseInt(topListDiv.children[3].children[0].nextSibling.textContent.trim()) || 0,
                    totalParcels: parseInt(topListDiv.children[4].children[0].nextSibling.textContent.trim()) || 0,
                    shippedParcels: parseInt(topListDiv.children[5].children[0].nextSibling.textContent.trim()) || 0,
                };

                // 2. 包裹量排名（从 #ParcelRank 中提取）
                const parcelRankUl = document.getElementById('ParcelRank');
                const parcelRank = Array.from(parcelRankUl.children).map(li => {
                    const [_, province, count] = li.textContent.match(/^\d+\.\s*([^:]+):\s*(\d+)$/) || [];
                    return { province, parcelCount: parseInt(count) || 0 };
                }).filter(item => item.province && item.parcelCount);

                // 3. 各平台占比（从 chart2 图表中提取）
                const platformChart = echarts.getInstanceByDom(document.getElementById('chart2'));
                const platformData = platformChart.getOption().series[0].data.map(item => ({
                    platform: item.name,
                    percentage: item.value
                }));

                // 4. 汽车品牌销售排行（从 AutomobileBrandSalesChart 图表中提取）
                const autoBrandChart = echarts.getInstanceByDom(document.getElementById('AutomobileBrandSalesChart'));
                const autoSales = autoBrandChart.getOption().series[0].data.map(item => ({
                    brandName: item.name,
                    sales: item.value
                }));

                // 5. 汽车分类占比（从 AutomobileClassificationProportion 图表中提取）
                const autoClassChart = echarts.getInstanceByDom(document.getElementById('AutomobileClassificationProportion'));
                const autoClassData = autoClassChart.getOption().series[0].data.map(item => ({
                    name: item.name,
                    value: item.value
                }));

                // 6. 月统计（从 MonthlyStatistics 图表中提取）
                const monthlyChart = echarts.getInstanceByDom(document.getElementById('MonthlyStatistics'));
                const monthlyStats = {
                    orderVolume: monthlyChart.getOption().series[0].data,
                    paymentVolume: monthlyChart.getOption().series[1].data,
                    average: monthlyChart.getOption().series[2].data
                };

                // 7. 全球贸易国家排名（从 NationalRankingOfTradingCountries 图表中提取）
                const tradeChart = echarts.getInstanceByDom(document.getElementById('NationalRankingOfTradingCountries'));
                const tradeRanking = tradeChart.getOption().series[7].data.map((item, index) => ({
                    country: tradeChart.getOption().xAxis[0].data[index],
                    value: item.value
                }));

                // 8. 获取图表图片
                const chartImages = {
                    monthlyChartImg: monthlyChart ? monthlyChart.getDataURL({ type: 'png', pixelRatio: 2 }) : '',
                    autoClassChartImg: autoClassChart ? autoClassChart.getDataURL({ type: 'png', pixelRatio: 2 }) : '',
                    autoBrandChartImg: autoBrandChart ? autoBrandChart.getDataURL({ type: 'png', pixelRatio: 2 }) : '',
                    platformChartImg: platformChart ? platformChart.getDataURL({ type: 'png', pixelRatio: 2 }) : '',
                    tradeChartImg: tradeChart ? tradeChart.getDataURL({ type: 'png', pixelRatio: 2 }) : ''
                };

                return {
                    basicInfo,
                    parcelRank,
                    platformData,
                    autoSales,
                    autoClassData,
                    monthlyStats,
                    tradeRanking,
                    date: new Date().toLocaleDateString(),
                    ...chartImages
                };
            } catch (error) {
                console.error('从页面收集数据失败:', error);
                throw new Error('无法从页面收集数据，请确保所有图表和数据已正确加载');
            }
        }

        // 生成销售策略方案
        function generateSalesStrategy(data) {
            const topProvince = data.parcelRank[0].province;
            const topModel = data.autoSales[0].brandName;
            const totalSalesValue = data.basicInfo.transactionAmount;
            const totalOrders = data.basicInfo.transactionCount;
            const avgOrderValue = (totalSalesValue / totalOrders).toFixed(2);
            const marketShare = 15.5; // Assumed market share
            const salesGrowth = ((data.monthlyStats.paymentVolume[11] - data.monthlyStats.paymentVolume[0]) / data.monthlyStats.paymentVolume[0] * 100).toFixed(1);
            const topPlatform = data.platformData[0].platform;
            const topTradeCountry = data.tradeRanking[0].country;

            const strategyContent = `
# 星云汽车销售策略方案
*生成日期: ${data.date}*

## 一、数据概况
### 1.1 关键指标
- **总销售额**: ¥${(totalSalesValue / 10000).toFixed(1)}万 (同比增长${salesGrowth}%)
- **总订单量**: ${totalOrders} 单
- **平均订单价值**: ¥${avgOrderValue}
- **总包裹量**: ${data.basicInfo.totalParcels} 件
- **已发件**: ${data.basicInfo.shippedParcels} 件 (占比${((data.basicInfo.shippedParcels / data.basicInfo.totalParcels) * 100).toFixed(1)}%)
- **在线用户数**: ${data.basicInfo.onlineUsers} 人
- **在线商家数**: ${data.basicInfo.onlineMerchants} 家
- **市场占有率**: ${marketShare}% (假设行业排名第3)

### 1.2 数据分析与洞察
- **销售表现**: 本期总销售额¥${(totalSalesValue / 10000).toFixed(1)}万，同比增长${salesGrowth}%。增长主要集中在${data.monthlyStats.paymentVolume.indexOf(Math.max(...data.monthlyStats.paymentVolume)) + 1}月，付款量达${Math.max(...data.monthlyStats.paymentVolume)}万，显示季节性消费高峰。
- **订单与客单价**: 平均订单价值¥${avgOrderValue}，表明消费者倾向中高端车型。订单量${totalOrders}单中，付款订单占比${((data.basicInfo.transactionCount / totalOrders) * 100).toFixed(1)}%，转化率较高。
- **物流效率**: 总包裹量${data.basicInfo.totalParcels}件，已发件占比${((data.basicInfo.shippedParcels / data.basicInfo.totalParcels) * 100).toFixed(1)}%。未发件${(data.basicInfo.totalParcels - data.basicInfo.shippedParcels)}件，需关注物流瓶颈。
- **市场地位**: 当前市场占有率${marketShare}%，位列行业前三，但与领先企业（假设25%）相比仍有差距，需通过精准营销和产品优化提升竞争力。

## 二、销售分布分析
### 2.1 地区分布
#### 数据详情
| 排名 | 省份 | 包裹量 (件) | 占比 (%) |
|------|------|-------------|----------|
${data.parcelRank.map((item, index) => `| ${index + 1} | ${item.province} | ${item.parcelCount} | ${((item.parcelCount / data.parcelRank.reduce((sum, r) => sum + r.parcelCount, 0)) * 100).toFixed(1)} |`).join('\n')}
- **核心市场**: ${topProvince}以${data.parcelRank[0].parcelCount}件包裹量位居首位，占比${((data.parcelRank[0].parcelCount / data.parcelRank.reduce((sum, r) => sum + r.parcelCount, 0)) * 100).toFixed(1)}%，消费能力强劲，可能是经济发达或汽车需求旺盛区域。
- **潜力市场**: ${data.parcelRank.slice(-2)[0].province}（${data.parcelRank.slice(-2)[0].parcelCount}件）和${data.parcelRank.slice(-1)[0].province}（${data.parcelRank.slice(-1)[0].parcelCount}件）排名靠后，合计占比不足${((data.parcelRank.slice(-2).reduce((sum, r) => sum + r.parcelCount, 0) / data.parcelRank.reduce((sum, r) => sum + r.parcelCount, 0)) * 100).toFixed(1)}%，存在较大增长空间。
- **区域差异**: 前三省份包裹量占总量的${((data.parcelRank.slice(0, 3).reduce((sum, r) => sum + r.parcelCount, 0) / data.parcelRank.reduce((sum, r) => sum + r.parcelCount, 0)) * 100).toFixed(1)}%，显示市场集中度较高，需平衡区域发展。

### 2.2 型号分布
#### 数据详情
| 排名 | 型号 | 销量 (辆) | 占比 (%) |
|------|------|-----------|----------|
${data.autoSales.map((item, index) => `| ${index + 1} | ${item.brandName} | ${item.sales} | ${((item.sales / data.autoSales.reduce((sum, m) => sum + m.sales, 0)) * 100).toFixed(1)} |`).join('\n')}
- **畅销型号**: ${topModel}以${data.autoSales[0].sales}辆销量领先，占比${((data.autoSales[0].sales / data.autoSales.reduce((sum, m) => sum + m.sales, 0)) * 100).toFixed(1)}%，反映其高市场接受度和品牌影响力。
- **潜力型号**: ${data.autoSales[1].brandName}（${data.autoSales[1].sales}辆）和${data.autoSales[2].brandName}（${data.autoSales[2].sales}辆）位列二、三名，合计占比${((data.autoSales.slice(1, 3).reduce((sum, m) => sum + m.sales, 0) / data.autoSales.reduce((sum, m) => sum + m.sales, 0)) * 100).toFixed(1)}%，显示多元化需求趋势。
- **分析**: 前三型号销量占${((data.autoSales.slice(0, 3).reduce((sum, m) => sum + m.sales, 0) / data.autoSales.reduce((sum, m) => sum + m.sales, 0)) * 100).toFixed(1)}%，需关注长尾型号的推广以提升整体销量。

## 三、数据可视化与深度分析
### 3.1 月度销售趋势
#### 图表
![月统计图](${data.monthlyChartImg})
#### 数据详情
| 月份 | 下单量 (万) | 付款量 (万) | 平均值 (万) |
|------|-------------|-------------|-------------|
${data.monthlyStats.orderVolume.map((order, i) => `| ${i + 1}月 | ${order} | ${data.monthlyStats.paymentVolume[i]} | ${data.monthlyStats.average[i]} |`).join('\n')}
- **趋势分析**:
  - **高峰**: ${data.monthlyStats.paymentVolume.indexOf(Math.max(...data.monthlyStats.paymentVolume)) + 1}月付款量达${Math.max(...data.monthlyStats.paymentVolume)}万，同比增长${salesGrowth}%，可能受促销或节假日驱动。
  - **低谷**: ${data.monthlyStats.paymentVolume.indexOf(Math.min(...data.monthlyStats.paymentVolume)) + 1}月仅${Math.min(...data.monthlyStats.paymentVolume)}万，需分析淡季原因。
  - **转化率**: 付款量与下单量平均差额${((data.monthlyStats.paymentVolume.reduce((sum, v) => sum + v, 0) - data.monthlyStats.orderVolume.reduce((sum, v) => sum + v, 0)) / 12).toFixed(1)}万，转化率约${((data.monthlyStats.paymentVolume.reduce((sum, v) => sum + v, 0) / data.monthlyStats.orderVolume.reduce((sum, v) => sum + v, 0)) * 100).toFixed(1)}%。

### 3.2 汽车分类占比
#### 图表
![汽车分类占比图](${data.autoClassChartImg})
#### 数据详情
| 分类 | 销量 (辆) | 占比 (%) |
|------|-----------|----------|
${data.autoClassData.map(item => `| ${item.name} | ${item.value} | ${((item.value / data.autoClassData.reduce((sum, m) => sum + m.value, 0)) * 100).toFixed(1)} |`).join('\n')}
- **主导类别**: ${data.autoClassData[0].name}占比${((data.autoClassData[0].value / data.autoClassData.reduce((sum, m) => sum + m.value, 0)) * 100).toFixed(1)}%，表明市场偏好明确。
- **细分趋势**: 低占比类别如${data.autoClassData.slice(-1)[0].name}（${((data.autoClassData.slice(-1)[0].value / data.autoClassData.reduce((sum, m) => sum + m.value, 0)) * 100).toFixed(1)}%）可能存在未开发需求。

### 3.3 汽车品牌销售排行
#### 图表
![汽车品牌销售排行图](${data.autoBrandChartImg})

### 3.4 各平台占比
#### 图表
![各平台占比图](${data.platformChartImg})
#### 数据详情
| 平台 | 占比 (%) |
|------|----------|
${data.platformData.map(item => `| ${item.platform} | ${item.percentage} |`).join('\n')}
- **主导平台**: ${topPlatform}占比${data.platformData[0].percentage}%，是主要销售渠道。
- **优化方向**: 次级平台${data.platformData[1].platform}（${data.platformData[1].percentage}%）需提升投放力度。

### 3.5 全球贸易国家排名
#### 图表
![全球贸易国家排名图](${data.tradeChartImg})
#### 数据详情
| 国家 | 贸易量 |
|------|--------|
${data.tradeRanking.map(item => `| ${item.country} | ${item.value} |`).join('\n')}
- **主要市场**: ${topTradeCountry}以${data.tradeRanking[0].value}领跑，显示出口潜力。

## 四、销售策略建议
### 4.1 市场布局
- **${topProvince}巩固策略**:
  - **行动计划**: 增加30%营销预算，推出“满¥5000减¥500”活动，预计提升销量20%。
  - **资源分配**: 增加5名销售人员，优化物流配送效率。
- **${data.parcelRank.slice(-2)[0].province}潜力开发**:
  - **行动计划**: 投入¥300,000用于市场调研和首轮促销，目标销量提升35%。
  - **资源分配**: 新设2个物流点，缩短配送时间。

### 4.2 产品策略
- **${topModel}推广计划**:

        function downloadWordDocument(content) {
            const htmlContent = marked.parse(content);

            const header = `
                <!DOCTYPE html>
                <html>
                <head>
                    <meta charset="UTF-8">
                    <style>
                        body { font-family: Arial, sans-serif; line-height: 1.6; margin: 20px; }

                        th { background-color: #f2f2f2; }
                        img { max-width: 100%; height: auto; margin: 10px 0; }
                    </style>
                </head>
                <body>
            `;

            const footer = `
                </body>
                </html>
            `;

            const sourceHTML = header + htmlContent + footer;

            const blob = new Blob(['\ufeff', sourceHTML], {
                type: 'application/msword'
            });

            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `星云汽车销售策略方案_${new Date().toLocaleDateString()}.doc`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
